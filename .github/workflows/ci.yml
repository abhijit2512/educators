name: CI

# Validates every push and pull request: type-check, lint and a full
# production build. No database is required — pages that read the DB have
# safe fallbacks, so the build passes without one.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values so Prisma and NextAuth don't complain during build.
      # No real database is contacted.
      DATABASE_URL: "mysql://user:pass@localhost:3306/educators"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
